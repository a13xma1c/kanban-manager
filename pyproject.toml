[project]
name = "kanbanmanager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.15"
dependencies = [
    "pyside6>=6.6.0",
    "pytest>=7.0.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
kanbanmanager = "kanbanmanager:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
